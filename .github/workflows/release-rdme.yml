# Regenerate GitHub profile README via @heyq02/readme (profile + brands).
name: Release README

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    if: github.repository == 'heyq02/heyq02'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tag pushes check out a detached HEAD; commit/push must land on main.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          cache: true

      - name: Build README
        run: vp run @heyq02/readme#build

      - name: Commit
        uses: EndBug/add-and-commit@v11
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: 'chore: update README.md [ci skip]'
          add: README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bot commit; skip vp staged so format-only noise cannot empty the commit.
          VP_GIT_HOOKS: '0'
