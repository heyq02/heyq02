name: Rsdoctor

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: Target branch to compare against
        required: false
        default: main
        type: string

jobs:
  bundle-analysis:
    name: Bundle analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Rsdoctor report
        env:
          RSDOCTOR: 'true'
        run: pnpm run build:rsdoctor

      - name: Bundle analysis
        uses: web-infra-dev/rsdoctor-action@main
        env:
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
        with:
          file_path: dist/.rsdoctor/rsdoctor-data.json
          target_branch: main
          dispatch_target_branch: ${{ github.event.inputs.target_branch }}
          ai_model: claude-3-5-haiku-latest
