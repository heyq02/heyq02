# Lint, typecheck, and site build on pull requests and pushes to main.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'heyq02/heyq02'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          cache: true

      - name: Check
        run: vp run ccheck

      - name: Test
        run: vp test

      # Fail fast on corrupt committed content/data JSON (no site build required).
      - name: Validate content
        run: vp run @heyq02/site#cvalidate-content

      # Fail if markdown-derived `recent-posts.json` drifted from the committed snapshot.
      - name: Prepare content
        run: vp run @heyq02/site#cprepare-content

      - name: Check generated content drift
        run: git diff --exit-code -- content/data/recent-posts.json

      # Uses committed `content/data/github-profile.json` — no live GitHub GraphQL in PR CI.
      - name: Build site
        run: vp run @heyq02/site#cbuild
