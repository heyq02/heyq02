name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 'lts'
          cache: false

      - name: Generate GitHub Changelog
        run: vpx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `vp pm stage publish` does not take --no-git-checks (unlike `vp pm publish`).
      # sxzz/workflows@vp still passes that flag and fails under current vite-plus.
      - name: Publish to NPM
        run: vp pm stage publish --access public -r
