# Build and deploy apps/site to GitHub Pages (heyq02.com).
name: Release Site

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 'lts'
          cache: true

      - name: Build site
        # vp run (not bare `vp build`) so cbuild dependsOn builds @heyq02/profile first.
        run: vp run @heyq02/site#cbuild

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './apps/site/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
