# Refresh GitHub profile data, commit it, then build & deploy apps/site to Pages.
name: Release Site

on:
  push:
    branches:
      - main
    paths-ignore:
      # Bot commits that only refresh GitHub snapshot must not re-enter this workflow.
      - 'content/data/github-pinned.json'
  schedule:
    # Keep pins / contribution heatmap fresh even without code pushes.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'heyq02/heyq02'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # lastUpdated reads git history for each page.
          fetch-depth: 0
          # Allow the bot commit step to push back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          cache: true

      - name: Refresh GitHub profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp run @heyq02/site#crefresh-profile

      - name: Commit profile data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(site): refresh GitHub profile data'
          file_pattern: content/data/github-pinned.json

      - name: Build site
        run: vp run @heyq02/site#cbuild

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    if: github.repository == 'heyq02/heyq02'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
