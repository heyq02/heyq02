# Build and deploy apps/site to GitHub Pages (heyq02.com).
name: Release Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'heyq02/heyq02'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # lastUpdated reads git history for each page.
          fetch-depth: 0

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          cache: true

      # DeepSeek output is build-only: keep last run's English tree so only new or
      # edited Chinese posts are sent to the API.
      - name: Cache blog translations
        uses: actions/cache@v5
        with:
          path: |
            apps/site/blogs/en/blog
            apps/site/blogs/.translate-cache.json
          key: blog-i18n-${{ hashFiles('apps/site/blogs/zh/**') }}
          restore-keys: |
            blog-i18n-

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: vp run @heyq02/site#cbuild

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    if: github.repository == 'heyq02/heyq02'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
