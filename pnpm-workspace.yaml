catalog:
  '@liangmi/vp-config': ^1.0.0
  '@types/node': ^26.6.6
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
    typescript: '*'
packages:
  - 'apps/*'
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  core-js: true
