name: heyq02 gh-pages workflow
description: Configure GitHub Pages and upload a static site artifact for deploy-pages.
inputs:
  dist-path:
    description: Path to the built site directory (relative to the repo root).
    required: false
    default: apps/site/dist
runs:
  using: composite
  steps:
    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.dist-path }}
